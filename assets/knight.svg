<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="칼을 바닥에 세우고 손잡이에 두 손을 얹은 기사 스케치">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
  </defs>

  <!-- 배경 없이 그리고, 다크 모드에서는 선을 밝게 바꾼다 -->
  <style>
    .ink { stroke: #2f2b26; }
    .bg { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e6edf3; }
      .bg { fill: #0d1117; }
    }
  </style>

  <g class="ink" filter="url(#rough)" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 투구 -->
    <path d="M74 92 l0 -38 q0 -28 26 -28 q26 0 26 28 l0 38 q-26 8 -52 0 z"/>
    <path d="M82 60 l36 0 M100 60 l0 22"/>

    <!-- 몸 -->
    <path d="M70 104 q30 -10 60 0 l6 108 M70 104 l-6 108"/>

    <!-- 바닥에 세운 칼과 손잡이에 얹은 두 손 -->
    <path d="M100 118 l0 12"/>
    <path d="M84 132 l32 0"/>
    <path d="M94 132 l0 80 l6 10 l6 -10 l0 -80"/>
    <ellipse class="bg" cx="100" cy="122" rx="10" ry="7"/>

    <!-- 바닥 -->
    <path d="M30 222 q70 -3 140 0"/>
  </g>
</svg>
